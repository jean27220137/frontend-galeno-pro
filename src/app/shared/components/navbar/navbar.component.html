<!-- ═══════════════════════════════════════════════════════════
     Navbar Superior Fijo — Galenos Pro
     ═══════════════════════════════════════════════════════════ -->
<header class="gp-navbar" role="banner">
  <nav class="gp-navbar__inner" aria-label="Navegación principal">

    <!-- ── Marca ─────────────────────────────────────────────── -->
    <a routerLink="/dashboard" class="gp-navbar__brand" aria-label="Inicio Galenos Pro">
      <div class="gp-navbar__logo-icon" aria-hidden="true">
        <i class="pi pi-heart-fill"></i>
      </div>
      <div class="gp-navbar__brand-text">
        <span class="gp-navbar__brand-name">Galenos</span>
        <span class="gp-navbar__brand-pro">Pro</span>
      </div>
    </a>

    <!-- ── Separador vertical ────────────────────────────────── -->
    <div class="gp-navbar__divider" aria-hidden="true"></div>

    <!-- ── Módulo activo (etiqueta, sin dropdown) ────────────── -->
    <div class="gp-navbar__module-label">
      <i class="pi pi-box"></i>
      <span>Módulo Farmacia</span>
    </div>

    <!-- ── Spacer ─────────────────────────────────────────────── -->
    <div class="tw-flex-1"></div>

    <!-- ── Acciones derecha ───────────────────────────────────── -->
    <div class="gp-navbar__actions">

      <!-- Notificaciones -->
      <button
        class="gp-navbar__icon-btn"
        aria-label="Notificaciones"
        pRipple
        type="button">
        <i class="pi pi-bell"></i>
        <span class="gp-navbar__badge pulse-badge">3</span>
      </button>

      <!-- Menú de Perfil de usuario -->
      <div class="gp-navbar__profile-wrapper">
        <button
          class="gp-navbar__profile-btn"
          (click)="profileMenu.toggle($event)"
          aria-haspopup="true"
          aria-label="Menú de usuario"
          type="button"
          pRipple>
          <p-avatar
            [label]="authService.currentUser()?.fullName?.charAt(0) ?? 'U'"
            styleClass="gp-navbar__avatar"
            shape="circle"
            size="normal" />
          <div class="gp-navbar__user-info">
            <span class="gp-navbar__user-name">{{ authService.userFullName() }}</span>
            <span class="gp-navbar__user-role">{{ authService.userRole() }}</span>
          </div>
          <i class="pi pi-chevron-down gp-navbar__chevron"></i>
        </button>

        <p-menu
          #profileMenu
          [model]="profileMenuItems"
          [popup]="true"
          appendTo="body"
          styleClass="gp-profile-menu" />
      </div>

      <!-- Hamburger (solo mobile) -->
      <button
        class="gp-navbar__hamburger gp-mobile-only"
        (click)="showMobileMenu.set(!showMobileMenu())"
        type="button"
        [attr.aria-expanded]="showMobileMenu()"
        aria-label="Abrir menú">
        <i [class]="showMobileMenu() ? 'pi pi-times' : 'pi pi-bars'"></i>
      </button>

    </div>

  </nav>

  <!-- ── Mobile navigation dropdown ────────────────────────────── -->
  @if (showMobileMenu()) {
    <div class="gp-mobile-nav gp-mobile-only" role="navigation" aria-label="Menú móvil">
      @for (link of mobileNavLinks; track link.routerLink) {
        <a
          [routerLink]="link.routerLink"
          (click)="showMobileMenu.set(false)"
          class="gp-mobile-nav__item">
          <i [class]="link.icon"></i>
          {{ link.label }}
        </a>
      }
      <div class="gp-mobile-nav__separator"></div>
      <button
        class="gp-mobile-nav__item gp-mobile-nav__signout"
        (click)="authService.logout(); showMobileMenu.set(false)"
        type="button">
        <i class="pi pi-sign-out"></i>
        Cerrar Sesión
      </button>
    </div>
  }

</header>

<style>
/* ── Navbar ──────────────────────────────────────────────────── */
.gp-navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  height: var(--navbar-height);
  background: linear-gradient(135deg, #1a48a8 0%, #2378f0 60%, #00bcd4 100%);
  box-shadow: 0 2px 12px rgba(23,72,168,.30);
  overflow: visible;
}

.gp-navbar__inner {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 1.25rem;
  gap: 0.5rem;
  overflow: visible;
}

/* Visibilidad responsive */
.gp-mobile-only { display: none; }

@media (max-width: 767px) {
  .gp-mobile-only           { display: flex; }
  .gp-navbar__user-info     { display: none; }
  .gp-navbar__chevron       { display: none; }
  .gp-navbar__module-label  { display: none; }
}

/* Marca */
.gp-navbar__brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  text-decoration: none;
  flex-shrink: 0;
  padding: 0.25rem 0.5rem;
  border-radius: 0.5rem;
  transition: background 0.15s;
}
.gp-navbar__brand:hover { background: rgba(255,255,255,.12); }

.gp-navbar__logo-icon {
  width: 2rem;
  height: 2rem;
  background: rgba(255,255,255,.2);
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  color: #fff;
}

.gp-navbar__brand-text {
  display: flex;
  align-items: baseline;
  gap: 0.25rem;
}
.gp-navbar__brand-name {
  font-size: 1.125rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
}
.gp-navbar__brand-pro {
  font-size: 0.75rem;
  font-weight: 600;
  color: #a5f3fc;
  background: rgba(255,255,255,.15);
  padding: 0.0625rem 0.375rem;
  border-radius: 0.25rem;
  letter-spacing: 0.05em;
}

/* Separador */
.gp-navbar__divider {
  width: 1px;
  height: 1.5rem;
  background: rgba(255,255,255,.25);
  margin: 0 0.25rem;
  flex-shrink: 0;
}

/* Etiqueta módulo activo */
.gp-navbar__module-label {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: rgba(255,255,255,.85);
  background: rgba(255,255,255,.12);
  padding: 0.25rem 0.75rem;
  border-radius: 0.5rem;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Acciones */
.gp-navbar__actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}

.gp-navbar__icon-btn {
  position: relative;
  width: 2.25rem;
  height: 2.25rem;
  background: rgba(255,255,255,.12);
  border: none;
  border-radius: 0.5rem;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: background 0.15s;
}
.gp-navbar__icon-btn:hover { background: rgba(255,255,255,.22); }

.gp-navbar__badge {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 1rem;
  height: 1rem;
  background: #ef4444;
  color: white;
  border-radius: 50%;
  font-size: 0.625rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #2378f0;
}

/* Perfil */
.gp-navbar__profile-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(255,255,255,.12);
  border: none;
  border-radius: 0.625rem;
  padding: 0.375rem 0.75rem;
  cursor: pointer;
  color: white;
  transition: background 0.15s;
  min-width: 0;
}
.gp-navbar__profile-btn:hover { background: rgba(255,255,255,.22); }

.gp-navbar__avatar {
  background: rgba(255,255,255,.25) !important;
  color: white !important;
  font-weight: 700 !important;
  font-size: 0.875rem !important;
  width: 2rem !important;
  height: 2rem !important;
}

.gp-navbar__user-info {
  display: flex;
  flex-direction: column;
  text-align: left;
  min-width: 0;
  max-width: 140px;
}
.gp-navbar__user-name {
  font-size: 0.8125rem;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gp-navbar__user-role {
  font-size: 0.6875rem;
  color: #a5f3fc;
  white-space: nowrap;
}
.gp-navbar__chevron {
  font-size: 0.6875rem;
  color: rgba(255,255,255,.7);
  transition: transform 0.2s;
}

/* Hamburger */
.gp-navbar__hamburger {
  width: 2.25rem;
  height: 2.25rem;
  background: rgba(255,255,255,.12);
  border: none;
  border-radius: 0.5rem;
  color: white;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  font-size: 1.125rem;
  transition: background 0.15s;
  flex-shrink: 0;
}
.gp-navbar__hamburger:hover { background: rgba(255,255,255,.22); }

/* Mobile dropdown nav */
.gp-mobile-nav {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: white;
  border-bottom: 1px solid #e2e8f0;
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
  flex-direction: column;
  padding: 0.5rem;
  max-height: calc(100vh - var(--navbar-height));
  overflow-y: auto;
  z-index: 1001;
}

.gp-mobile-nav__item {
  display: flex;
  align-items: center;
  gap: 0.875rem;
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  font-size: 0.9375rem;
  font-weight: 500;
  color: #1e293b;
  text-decoration: none;
  transition: background 0.15s;
  border: none;
  background: transparent;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.gp-mobile-nav__item:hover { background: #f1f5f9; color: #2378f0; }
.gp-mobile-nav__item i { color: #2378f0; font-size: 1rem; width: 1.25rem; text-align: center; }

.gp-mobile-nav__separator {
  height: 1px;
  background: #e2e8f0;
  margin: 0.25rem 0.5rem;
}

.gp-mobile-nav__signout { color: #ef4444; }
.gp-mobile-nav__signout i { color: #ef4444; }
.gp-mobile-nav__signout:hover { background: #fee2e2; color: #dc2626; }
</style>
